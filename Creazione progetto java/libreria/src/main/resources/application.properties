# Nome dell'applicazione
spring.application.name=libreria

# Configurazione della connessione MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/Libreria
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Diego_123

# Configurazione JPA e Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Visualizzazione delle query SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Strategia di denominazione delle tabelle e colonne
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl